name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Planner + QWOA self-checks
        run: |
          python quasar.py
          python quasar.py --start summit --minutes 25
          python quasar.py --minutes 5
      - name: Speedup analysis (small)
        run: python speedup.py --max-zones 3
