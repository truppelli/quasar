name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Planner + QWOA self-checks
        run: |
          python quasar.py
          python quasar.py --start summit --minutes 25
          python quasar.py --minutes 5
          python quasar.py resorts/crystal-mountain-washington.json --pods
          python quasar.py resorts/crystal-mountain-washington.json --pod "Rainier Express"
      - name: Visualizer API self-checks
        # serve.py runs its asserts, then serves; timeout's exit 124 means it got as far as serving
        run: timeout 5 python serve.py || [ $? -eq 124 ]
      - name: Speedup analysis (small)
        run: python speedup.py --max-zones 3
